name: tradepilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradepilot
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: tradepilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepilot -d tradepilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lean-gateway:
        condition: service_started
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://tradepilot:tradepilot@postgres:5432/tradepilot?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:8180,http://127.0.0.1:8180
      RENDER_EXTERNAL_URL: http://localhost:8180
      RUN_WORKERS_ON_START: "false"
      APP_OWNER_EMAIL: owner@example.com
      APP_AUTH_SECRET: tradepilot-local-docker-secret-change-me
      APP_AUTH_TOKEN_HOURS: "12"
      APP_ENABLE_PASSCODE_LOGIN: "false"
      RESEND_API_KEY: ""
      APP_EMAIL_FROM: "TradePilot AI <onboarding@resend.dev>"
      AI_PRIMARY_PROVIDER: mistral
      AI_PROVIDER: mistral
      AI_FALLBACK_PROVIDER: openai
      AI_FALLBACK_ENABLED: "true"
      TECHNICAL_FALLBACK_ENABLED: "true"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
      MISTRAL_API_KEY: ""
      MISTRAL_MODEL: mistral-small-latest
      PAPER_TRADING_ENABLED: "true"
      TRADING_ENGINE: lean
      ALPACA_TRADING_ENV: paper
      ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets/v2
      ALPACA_AUTH_MODE: api_key
      ALPACA_API_KEY_ID: ""
      ALPACA_API_SECRET_KEY: ""
      ALLOW_LIVE_BROKER_TRADING: "false"
      AUTO_SUBMIT_BROKER_PAPER_ORDERS: "false"
      STOCK_PRICE_REFRESH_MS: "5000"
      STOCK_PRICE_BASE_URL: https://query1.finance.yahoo.com
      CRYPTO_PRICE_REFRESH_MS: "5000"
      CRYPTO_PRICE_BASE_URL: https://api.binance.com
      NEWS_PROVIDER: finnhub
      FINNHUB_API_KEY: ""
      POLYGON_API_KEY: ""
      LEAN_ENGINE_URL: http://lean-gateway:8090
      LEAN_ENGINE_TOKEN: tradepilot-local-lean-token-change-me
      LEAN_ENGINE_IMAGE: tradepilot-lean-engine:latest
      LEAN_ENGINE_TIMEOUT_MS: "15000"
      LEAN_ALGORITHM_NAME: TradePilotLeanAlgorithm
      LEAN_ALGORITHM_VERSION: "1.1.0"
    command: ["sh", "-c", "npm run prisma:deploy:postgres && npm run start"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://tradepilot:tradepilot@postgres:5432/tradepilot?schema=public
      REDIS_URL: redis://redis:6379
      RUN_WORKERS_ON_START: "true"
      APP_OWNER_EMAIL: owner@example.com
      APP_AUTH_SECRET: tradepilot-local-docker-secret-change-me
      AI_PRIMARY_PROVIDER: mistral
      AI_PROVIDER: mistral
      TECHNICAL_FALLBACK_ENABLED: "true"
      PAPER_TRADING_ENABLED: "true"
      TRADING_ENGINE: lean
      ALPACA_TRADING_ENV: paper
      ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets/v2
      ALLOW_LIVE_BROKER_TRADING: "false"
      AUTO_SUBMIT_BROKER_PAPER_ORDERS: "false"
      LEAN_ENGINE_URL: http://lean-gateway:8090
      LEAN_ENGINE_TOKEN: tradepilot-local-lean-token-change-me
    command: ["sh", "-c", "npm run prisma:deploy:postgres && npm run worker"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8180:80"

  lean-gateway:
    build:
      context: .
      dockerfile: lean-gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8090
      LEAN_GATEWAY_TOKEN: tradepilot-local-lean-token-change-me
      LEAN_ENGINE_IMAGE: tradepilot-lean-engine:latest
      LEAN_EXECUTION_ENABLED: "false"
      LEAN_RUNTIME_DIR: lean-gateway/runtime
      LEAN_CONFIG_DIR: lean-engine/config
      ALPACA_API_KEY_ID: ""
      ALPACA_API_SECRET_KEY: ""
      ALLOW_LIVE_BROKER_TRADING: "false"
      LEAN_DOCKER_MEMORY: 4g
      LEAN_DOCKER_CPUS: "2"
    volumes:
      - lean_runtime:/app/lean-gateway/runtime
    ports:
      - "8190:8090"

volumes:
  postgres_data:
  redis_data:
  lean_runtime:
